name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: ci-test-database-only
          POSTGRES_DB: banking_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U banking -d banking_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://banking:ci-test-database-only@localhost:5432/banking_test
      JWT_SECRET: ci-only-signing-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install './backend[dev]'
      - run: ruff check --config backend/pyproject.toml backend migration/python && ruff format --check --config backend/pyproject.toml backend migration/python
      - run: pytest --cov=app --cov-report=xml --junitxml=test-results.xml -q
        working-directory: backend
      - run: npm ci && npm run lint && npm run build && npm test
        working-directory: frontend
      - name: Python and TypeScript parity
        run: |
          python migration/python/runner.py > /tmp/python.jsonl
          node --experimental-strip-types migration/typescript/runner.ts > /tmp/typescript.jsonl
          diff -u /tmp/python.jsonl /tmp/typescript.jsonl
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-results
          path: |
            backend/test-results.xml
            backend/coverage.xml
  compose-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            frontend/playwright-report
            frontend/test-results
