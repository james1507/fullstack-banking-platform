[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.121.3", "uvicorn==0.38.0", "SQLAlchemy==2.0.44",
  "psycopg[binary]==3.2.12", "alembic==1.17.2", "pydantic-settings==2.12.0",
  "PyJWT==2.10.1", "argon2-cffi==25.1.0", "email-validator==2.3.0"
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.6", "pytest-cov==7.0.0"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
